<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>과학 시뮬레이션 도구</title>
<meta name="description" content="충국쌤의 과학 시뮬레이션 도구 모음 — 통합과학, 물리학, 화학, 생명과학, 지구과학 수업용 시뮬레이션과 교실 프로그램">
<meta property="og:title" content="과학 시뮬레이션 도구">
<meta property="og:description" content="충국쌤의 과학 시뮬레이션 도구 모음">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root {
    --bg: #f7f8fb;
    --surface: #ffffff;
    --text: #15171c;
    --muted: #5d6472;
    --line: #e4e7ee;
    --accent: #3b5bdb;
    --hero-1: #e7ecff;
    --hero-2: #f3e8ff;
    --shadow: 0 1px 2px rgba(20,25,40,.04), 0 4px 14px rgba(20,25,40,.06);
    --c-int: #0c8599;  --c-phy: #1c7ed6; --c-chem: #e8590c;
    --c-bio: #2f9e44;  --c-earth: #9c6b30; --c-prog: #7048e8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101217; --surface: #181b22; --text: #eceef3; --muted: #9aa1ae;
      --line: #2a2e38; --accent: #7c95ff; --hero-1: #1a2140; --hero-2: #261a3a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
      --c-int: #3bc9db; --c-phy: #4dabf7; --c-chem: #ff922b;
      --c-bio: #51cf66; --c-earth: #d4a373; --c-prog: #9775fa;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101217; --surface: #181b22; --text: #eceef3; --muted: #9aa1ae;
    --line: #2a2e38; --accent: #7c95ff; --hero-1: #1a2140; --hero-2: #261a3a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    --c-int: #3bc9db; --c-phy: #4dabf7; --c-chem: #ff922b;
    --c-bio: #51cf66; --c-earth: #d4a373; --c-prog: #9775fa;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.5; word-break: keep-all;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

  header.top {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  }
  .top .wrap { display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .brand { font-weight: 700; display: flex; gap: 8px; align-items: center; }
  .theme-btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    border-radius: 999px; width: 36px; height: 36px; cursor: pointer; font-size: 16px;
  }

  .hero {
    background: linear-gradient(135deg, var(--hero-1), var(--hero-2));
    border-bottom: 1px solid var(--line);
  }
  .hero .wrap { padding-top: 56px; padding-bottom: 48px; }
  .hero h1 { font-size: clamp(28px, 5vw, 44px); line-height: 1.2; margin: 0 0 12px; letter-spacing: -0.02em; }
  .hero p { margin: 0; color: var(--muted); font-size: clamp(15px, 2.2vw, 18px); }
  .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
  .stat {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 14px; font-size: 14px; color: var(--muted);
  }
  .stat b { color: var(--text); font-size: 16px; margin-right: 4px; font-variant-numeric: tabular-nums; }

  .controls { padding: 24px 0 8px; display: flex; flex-direction: column; gap: 14px; }
  .search {
    width: 100%; padding: 12px 16px; font: inherit; font-size: 16px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text);
  }
  .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--text);
    padding: 7px 14px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer;
    display: inline-flex; gap: 6px; align-items: center;
  }
  .chip .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }

  .result-info { color: var(--muted); font-size: 14px; margin: 8px 0 14px; }
  .grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    padding-bottom: 48px;
  }
  .card {
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: var(--shadow);
    transition: transform .15s ease, border-color .15s ease;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .thumb {
    aspect-ratio: 16 / 10; display: grid; place-items: center; font-size: 40px;
    background: color-mix(in srgb, var(--cc) 12%, var(--surface));
    border-bottom: 1px solid var(--line); overflow: hidden;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; transition: transform .3s ease; }
  .card:hover .thumb img { transform: scale(1.04); }
  .body { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 16px; flex: 1; }
  .card h3 { margin: 0; font-size: 17px; line-height: 1.35; }
  .url { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
  .tag {
    font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 6px;
    color: var(--cc); background: color-mix(in srgb, var(--cc) 12%, transparent);
  }
  .empty { text-align: center; color: var(--muted); padding: 48px 0; grid-column: 1 / -1; }

  footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  footer .wrap { padding: 24px 16px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#">🧪 충국쌤 과학실</a>
    <button class="theme-btn" id="themeBtn" aria-label="밝기 모드 전환">🌓</button>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1>과학 시뮬레이션 도구</h1>
    <p>충국쌤의 과학 수업용 시뮬레이션과 교실 프로그램 모음입니다.<br>카드를 누르면 바로 실행됩니다.</p>
    <div class="stats" id="stats"></div>
  </div>
</section>

<main class="wrap">
  <div class="controls">
    <input class="search" id="search" type="search" placeholder="시뮬레이션 검색 (예: DNA, 회로, 화학결합)" aria-label="검색">
    <div class="chips" id="chips" role="toolbar" aria-label="카테고리"></div>
  </div>
  <div class="result-info" id="info"></div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <div class="wrap">
    <span>© 충국쌤의 과학 시뮬레이션 도구</span>
    <span>수업에 자유롭게 활용하세요</span>
  </div>
</footer>

<script>
const CATS = {
  "통합과학": { color: "--c-int",   icon: "🔬" },
  "물리학":   { color: "--c-phy",   icon: "⚡" },
  "화학":     { color: "--c-chem",  icon: "⚗️" },
  "생명과학": { color: "--c-bio",   icon: "🧬" },
  "지구과학": { color: "--c-earth", icon: "🌏" },
  "프로그램": { color: "--c-prog",  icon: "🛠️" },
};

// 항목 목록은 items.json 에 있습니다 (Notion에서 자동 동기화).
let ITEMS = [];
const DEFAULT_CAT = { color: "--accent", icon: "📌" };
const cat = (k) => CATS[k] || DEFAULT_CAT;

const $ = (id) => document.getElementById(id);
let active = "전체";

function readHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  return ITEMS.some(i => i.tags.includes(h)) ? h : "전체";
}

function renderChips() {
  const counts = { "전체": ITEMS.length };
  const cats = [...Object.keys(CATS), ...new Set(ITEMS.flatMap(i => i.tags).filter(t => !CATS[t]))];
  for (const k of cats) { const n = ITEMS.filter(i => i.tags.includes(k)).length; if (n) counts[k] = n; }
  $("chips").innerHTML = Object.keys(counts).map(k =>
    `<button class="chip" data-cat="${esc(k)}" aria-pressed="${k === active}">${k === "전체" ? "" : cat(k).icon + " "}${esc(k)}<span class="n">${counts[k]}</span></button>`
  ).join("");
  $("stats").innerHTML =
    `<span class="stat"><b>${ITEMS.length}</b>개 도구</span>` +
    Object.keys(counts).filter(k => k !== "전체").map(k => `<span class="stat"><b>${counts[k]}</b>${esc(k)}</span>`).join("");
}

function render() {
  const q = $("search").value.trim().toLowerCase();
  const list = ITEMS.filter(i =>
    (active === "전체" || i.tags.includes(active)) &&
    (!q || i.title.toLowerCase().includes(q) || i.tags.join(" ").includes(q))
  );
  $("info").textContent = `${active}${q ? ` · "${$("search").value.trim()}"` : ""} — ${list.length}개`;
  $("grid").innerHTML = list.length ? list.map(i => {
    const main = (active !== "전체" && i.tags.includes(active)) ? active : i.tags[i.tags.length - 1];
    const c = cat(main);
    const host = i.url.replace(/^https?:\/\//, "").replace(/\/$/, "");
    return `<a class="card" href="${esc(i.url)}" target="_blank" rel="noopener" style="--cc: var(${c.color})">
      <div class="thumb">${i.thumb ? `<img src="${esc(i.thumb)}" alt="" loading="lazy" decoding="async">` : c.icon}</div>
      <div class="body">
        <h3>${esc(i.title)}</h3>
        <div class="url">${esc(host)}</div>
        <div class="tags">${i.tags.map(t => `<span class="tag" style="--cc: var(${cat(t).color})">${esc(t)}</span>`).join("")}</div>
      </div>
    </a>`;
  }).join("") : `<div class="empty">검색 결과가 없습니다.</div>`;
  document.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.cat === active));
}

$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  active = b.dataset.cat;
  history.replaceState(null, "", active === "전체" ? location.pathname : "#" + encodeURIComponent(active));
  render();
});
$("search").addEventListener("input", render);
window.addEventListener("hashchange", () => { active = readHash(); render(); });

// 밝기 모드
const root = document.documentElement;
try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch (e) {}
$("themeBtn").addEventListener("click", () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
});

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

fetch("items.json", { cache: "no-cache" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => {
    ITEMS = data.filter(i => /^https?:\/\//.test(i.url));
    active = readHash();
    renderChips();
    render();
  })
  .catch(() => { $("grid").innerHTML = `<div class="empty">목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</div>`; });
</script>
</body>
</html>
